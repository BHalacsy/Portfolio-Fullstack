services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "5127:5127"
    environment:
      - REDIS_ADDR=redis_server:6379
      - PORT=5127
    depends_on:
      redis_server:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  redis_server:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: always
    networks:
      - app-network
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
